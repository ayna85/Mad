    <link rel="manifest" href="/manifest.json" />
    <script>
      // Runtime Supabase configuration initialization
      try {
        if (!window.__SUPABASE_CONFIG__) {
          var u = localStorage.getItem('mad_supabase_url');
          var k = localStorage.getItem('mad_supabase_anon_key');
          if (u && k) {
            window.__SUPABASE_CONFIG__ = { url: u, anonKey: k };
          }
        }
      } catch (e) {}
    </script>
